[package]
name = "stillus-app"
version = "0.1.4"
edition = "2024"
publish = false
license.workspace = true
authors.workspace = true

[features]
test-utils = ["stillus-core/test-utils"]

[dependencies]
stillus-chat = { version = "0.1.0", path = "../../crates/stillus-chat" }
stillus-engine = { path = "../../crates/stillus-engine" }
stillus-security = { path = "../../crates/stillus-security" }
stillus-storage = { path = "../../crates/stillus-storage" }
stillus-ai = { version = "0.1.0", path = "../../crates/stillus-ai" }
stillus-platform = { version = "0.1.0", path = "../../crates/stillus-platform", features = ["credentials"] }
fluent-bundle = "=0.16.0"
floem_renderer = "=0.2.0"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
pulldown-cmark = { version = "=0.13.4", default-features = false }
url = "=2.5.8"
floem = { version = "=0.2.0", default-features = false, features = ["rfd-async-std", "vger", "editor"] }
stillus-core = { version = "0.1.0", path = "../../crates/stillus-core" }
stillus-editor = { version = "0.1.0", path = "../../crates/stillus-editor" }
stillus-search = { version = "0.1.0", path = "../../crates/stillus-search" }
stillus-secure = { version = "0.1.0", path = "../../crates/stillus-secure" }
stillus-update = { version = "0.1.0", path = "../../crates/stillus-update" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
zeroize = "=1.8.1"

[target.'cfg(target_os = "macos")'.dependencies]
floem-winit = { version = "=0.29.5" }
rfd = { version = "=0.14.1", default-features = false }
copypasta = { version = "=0.10.2", default-features = false }

[target.'cfg(windows)'.dependencies]
rfd = { version = "=0.14.1", default-features = false }
copypasta = { version = "=0.10.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { version = "=0.9.7", default-features = false }
