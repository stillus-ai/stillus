[package]
name = "stillus-storage"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
authors.workspace = true

[features]
test-utils = ["stillus-secure/test-utils", "stillus-platform/test-utils"]

[dependencies]
stillus-platform = { version = "0.1.0", path = "../stillus-platform" }
stillus-frontmatter = { version = "0.1.0", path = "../stillus-frontmatter" }
stillus-secure = { version = "0.1.0", path = "../stillus-secure" }
pulldown-cmark = { version = "=0.13.4", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[dev-dependencies]
stillus-platform = { version = "0.1.0", path = "../stillus-platform", features = ["test-utils"] }
stillus-engine = { version = "0.1.0", path = "../stillus-engine" }
stillus-secure = { version = "0.1.0", path = "../stillus-secure", features = ["test-utils"] }
stillus-security = { version = "0.1.0", path = "../stillus-security", features = ["test-utils"] }
